<!DOCTYPE html>
<html lang="uk">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo LTD | Прайс-лист</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f1112; 
            --bg-card: #16181a;
            --accent: #d99058; 
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.06);
            --gradient: linear-gradient(135deg, #d99058 0%, #a65f2e 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; background: rgba(15, 17, 18, 0.85); backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid var(--border); }
        .logo img { height: 45px; display: block; width: auto; }
        .nav-links a { color: var(--text); text-decoration: none; margin: 0 20px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        .nav-links a:hover { color: var(--accent); }
        
        .header-controls { display: flex; gap: 30px; align-items: center; }
        .phones a { color: var(--text); text-decoration: none; font-weight: 700; margin-left: 15px; font-size: 1rem; }
        .phones a:hover { color: var(--accent); }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .lang-btn {
            background: transparent; border: none; color: #888; padding: 8px 12px;
            font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .lang-btn.active, .lang-btn:hover { background: var(--gradient); color: #000; }

        .price-section { padding: 160px 8% 100px 8%; min-height: 100vh; }
        
        /* Блок кожної категорії */
        .category-block { margin-bottom: 80px; }
        .category-block h2 { 
            font-size: 2.2rem; font-weight: 800; text-transform: uppercase; 
            margin-bottom: 25px; color: var(--text); 
            border-left: 5px solid var(--accent); padding-left: 15px;
        }

        .table-container {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; overflow-x: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { padding: 20px 25px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        th:last-child, td:last-child { border-right: none; }
        
        th { background: rgba(255, 255, 255, 0.02); color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        td { font-size: 0.95rem; color: #ddd; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.01); color: #fff; }

        .loading { text-align: center; padding: 100px; color: #777; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }

        @media (max-width: 1024px) {
            header { padding: 20px; flex-direction: column; gap: 15px; }
            .price-section { padding-top: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Apollo LTD"></a>
        </div>
        <nav class="nav-links">
            <a href="index.html" data-i18n="nav_home">Головна</a>
            <a href="catalog.html" data-i18n="nav_catalog">Каталог</a>
            <a href="index.html#sec-04" data-i18n="nav_contacts">Контакти</a>
        </nav>
        <div class="header-controls">
            <div class="phones">
                <a href="tel:+380960000076">096 000 00 76</a>
                <a href="tel:+380685386923">068 538 69 23</a>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="setLanguage('uk')">UA</button>
                <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
                <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <section class="price-section">
        <div id="dynamic-price-container">
            <div class="loading" data-i18n="loading">Оновлення прайсу...</div>
        </div>
    </section>

    <script>
        // ВСТАВТЕ СЮДИ URL ВАШОГО WEB APP З GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby74IlLa9OPNPcGb3usiAUUKZNymW_EMstPbLE9h_RAIjt4uiMHJxX3QISRLrvv9No/exec'; 

        // Словник для фіксованих слів (шапка, назви категорій, заголовки колонок)
        const siteTranslations = {
            uk: {
                nav_home: "Головна", nav_catalog: "Каталог", nav_contacts: "Контакти", loading: "Оновлення прайсу...",
                "Дошка необрізна": "Дошка необрізна", "Дошка обрізна": "Дошка обрізна", "Брус": "Брус", "Погонаж": "Погонажні вироби",
                "Порода (Укр)": "Порода", "Сорт": "Сорт", "Ціна": "Ціна", "Товщина": "Товщина", "Ширина": "Ширина"
            },
            ru: {
                nav_home: "Главная", nav_catalog: "Каталог", nav_contacts: "Контакты", loading: "Обновление прайса...",
                "Дошка необрізна": "Доска необрезная", "Дошка обрізна": "Доска обрезная", "Брус": "Брус", "Погонаж": "Погонажные изделия",
                "Порода (Укр)": "Порода", "Сорт": "Сорт", "Ціна": "Цена", "Товщина": "Толщина", "Ширина": "Ширина"
            },
            en: {
                nav_home: "Home", nav_catalog: "Catalog", nav_contacts: "Contacts", loading: "Loading prices...",
                "Дошка необрізна": "Unedged Board", "Дошка обрізна": "Edged Board", "Брус": "Timber", "Погонаж": "Molding Products",
                "Порода (Укр)": "Wood Type", "Сорт": "Grade", "Ціна": "Price", "Товщина": "Thickness", "Ширина": "Width"
            }
        };

        async function loadDynamicPrices() {
            const container = document.getElementById('dynamic-price-container');
            try {
                if(SCRIPT_URL.includes('ВСТАВТЕ_ВАШ_URL')) {
                    container.innerHTML = '<div class="loading" style="color:var(--accent);">Очікування підключення Google Таблиці...</div>';
                    return;
                }

                // Google Apps Script requires following redirects for GET requests
                const response = await fetch(SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const tabs = await response.json(); 
                
                let html = '';
                
                tabs.forEach(tab => {
                    html += `<div class="category-block">`;
                    html += `<h2 data-dyn="${tab.name}">${tab.name}</h2>`;
                    html += `<div class="table-container"><table>`;

                    const rows = tab.data;
                    if(rows.length > 0) {
                        // 1. ПОПОВНЮЄМО СЛОВНИК З 1, 2 і 3 КОЛОНКИ (пропускаємо заголовок)
                        for(let i = 1; i < rows.length; i++) {
                            // Якщо колонок хоча б 3, вважаємо, що там є переклади
                            if(rows[i].length >= 3) {
                                let ukWord = rows[i][0].trim();
                                let ruWord = rows[i][1].trim();
                                let enWord = rows[i][2].trim();
                                
                                if(ukWord) {
                                    siteTranslations.uk[ukWord] = ukWord;
                                    siteTranslations.ru[ukWord] = ruWord || ukWord;
                                    siteTranslations.en[ukWord] = enWord || ukWord;
                                }
                            }
                        }

                        // 2. БУДУЄМО ШАПКУ (Пропускаючи колонки 1 і 2, тобто Рос і Англ переклади)
                        html += `<thead><tr>`;
                        html += `<th data-dyn="${rows[0][0].trim()}">${rows[0][0].trim()}</th>`; // Перша колонка (Укр)
                        // Починаємо з 3-го індексу (тобто з 4-ї колонки: Сорт, Ціна тощо)
                        for(let j = 3; j < rows[0].length; j++) {
                            html += `<th data-dyn="${rows[0][j].trim()}">${rows[0][j].trim()}</th>`;
                        }
                        html += `</tr></thead><tbody>`;

                        // 3. БУДУЄМО ТІЛО ТАБЛИЦІ (Також пропускаючи технічні колонки з перекладами)
                        let skipCount = 0;
                        for(let i = 1; i < rows.length; i++) {
                            html += `<tr>`;
                            
                            // Завжди малюємо першу колонку з назвою (Укр), вона буде об'єднуватись
                            let cellValue = rows[i][0].trim();
                            if (cellValue !== "") {
                                if (skipCount > 0) {
                                    skipCount--;
                                } else {
                                    let rowspan = 1;
                                    while (i + rowspan < rows.length && rows[i + rowspan][0].trim() === cellValue) {
                                        rowspan++;
                                    }
                                    if (rowspan > 1) {
                                        html += `<td rowspan="${rowspan}" data-dyn="${cellValue}"><strong>${cellValue}</strong></td>`;
                                        skipCount = rowspan - 1;
                                    } else {
                                        html += `<td data-dyn="${cellValue}"><strong>${cellValue}</strong></td>`;
                                    }
                                }
                            } else {
                                html += `<td data-dyn="${cellValue}"></td>`;
                            }

                            // Малюємо всі інші колонки, починаючи з 4-ї (індекс 3)
                            for(let j = 3; j < rows[i].length; j++) {
                                html += `<td data-dyn="${rows[i][j].trim()}">${rows[i][j].trim()}</td>`;
                            }
                            
                            html += `</tr>`;
                        }
                        html += `</tbody>`;
                    }
                    html += `</table></div></div>`;
                });
                
                container.innerHTML = html;

                // Запускаємо переклад після побудови
                const savedLang = localStorage.getItem('apollo_lang') || 'uk';
                setLanguage(savedLang);

            } catch (e) {
                container.innerHTML = '<div class="loading" style="color: #d9534f;">Помилка завантаження прайсу. Перевірте з\'єднання.</div>';
            }
        }

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.querySelector(`.lang-btn[onclick*="${lang}"]`);
            if(btn) btn.classList.add('active');

            // Переклад статичних елементів (шапка)
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(siteTranslations[lang] && siteTranslations[lang][key]) el.innerText = siteTranslations[lang][key];
            });

            // Переклад ДИНАМІЧНИХ даних
            document.querySelectorAll('[data-dyn]').forEach(el => {
                const originalText = el.getAttribute('data-dyn'); 
                if(siteTranslations[lang][originalText]) {
                    el.innerHTML = el.tagName === 'TD' && el.hasAttribute('rowspan') 
                        ? `<strong>${siteTranslations[lang][originalText]}</strong>` 
                        : siteTranslations[lang][originalText];
                } else {
                    el.innerHTML = el.tagName === 'TD' && el.hasAttribute('rowspan') 
                        ? `<strong>${originalText}</strong>` 
                        : originalText;
                }
            });

            localStorage.setItem('apollo_lang', lang);
        }

        loadDynamicPrices();

        
    </script>
</body>
</html>
