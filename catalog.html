<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Apollo LTD</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121416;
            --card-bg: #1a1d20;
            --accent: #d99058;
            --text: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(18, 20, 22, 0.95);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo h2 { letter-spacing: 2px; font-weight: 800; cursor: pointer; }
        .logo span { color: var(--accent); }
        .logo img { height: 45px; display: block; width: auto; }
        
        .nav-links a { color: var(--text); text-decoration: none; margin-right: 25px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        
        .header-controls { display: flex; gap: 30px; align-items: center; }
        
        .lang-switcher { display: flex; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .lang-btn { background: transparent; border: none; color: #888; padding: 8px 12px; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .lang-btn.active, .lang-btn:hover { background: var(--accent); color: #000; }

        .cart-btn { background: var(--accent); color: #000; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: 700; transition: 0.3s; text-transform: uppercase; font-size: 0.85rem;}
        .cart-btn:hover { box-shadow: 0 5px 15px rgba(217, 144, 88, 0.3); transform: translateY(-2px); }

        .catalog-container { display: flex; padding: 40px 50px; gap: 40px; max-width: 1600px; margin: 0 auto; min-height: 80vh; }
        
        .sidebar { width: 250px; flex-shrink: 0; }
        .sidebar h3 { margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; font-weight: 700; text-transform: uppercase;}
        .category-list { list-style: none; }
        .category-list li { margin-bottom: 15px; cursor: pointer; transition: 0.2s; color: var(--text-muted); font-weight: 600; }
        .category-list li:hover, .category-list li.active { color: var(--accent); padding-left: 10px; }

        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; align-content: start; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.4); transform: translateY(-5px); }
        
        .card-img { width: 100%; height: 220px; background-color: #0a0b0c; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img img { transform: scale(1.05); }
        .no-photo { color: #444; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }

        .card-content { padding: 25px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; line-height: 1.4; flex: 1; }
        .card-price { color: var(--accent); font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
        
        .card-buy-section { display: flex; gap: 10px; margin-top: auto; }
        .card-buy-section input { width: 70px; padding: 12px; background: #0a0b0c; border: 1px solid var(--border); color: #fff; border-radius: 5px; text-align: center; font-size: 1rem; font-weight: 600; outline: none; }
        .card-buy-section input:focus { border-color: var(--accent); }
        .card-buy-section button { flex: 1; background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; border-radius: 5px; font-weight: 700; transition: 0.3s; font-size: 0.9rem; text-transform: uppercase; }
        .card-buy-section button:hover { background: var(--accent); color: #000; }

        .loader { width: 100%; text-align: center; padding: 100px; font-size: 1.2rem; color: #777; font-weight: 600; grid-column: 1 / -1; text-transform: uppercase; letter-spacing: 2px;}

        /* КОРЗИНА */
        .cart-modal {
            position: fixed; top: 0; right: -100%; width: 450px; height: 100vh;
            background: rgba(18, 20, 22, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); z-index: 200; padding: 40px; 
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .cart-modal.open { right: 0; }
        .close-cart { cursor: pointer; color: var(--text-muted); font-size: 2rem; text-align: right; margin-bottom: 20px; transition: 0.3s; }
        .close-cart:hover { color: var(--accent); transform: scale(1.1); }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 10px; }
        .cart-item { border-bottom: 1px solid var(--border); padding: 20px 0; position: relative; }
        .cart-item-title { font-weight: 700; margin-bottom: 10px; font-size: 1.05rem; padding-right: 25px;}
        .cart-item-details { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.95rem; }
        .remove-item { position: absolute; top: 20px; right: 0; color: #ff4444; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .cart-total-wrap { font-size: 1.5rem; font-weight: 800; text-align: right; margin-bottom: 30px; color: var(--accent); }
        
        .checkout-form input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: white; border-radius: 5px; font-family: 'Montserrat'; font-size: 1rem; outline: none;}
        .checkout-form input:focus { border-color: var(--accent); }
        .checkout-form button { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 5px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .checkout-form button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(217, 144, 88, 0.2); }

        @media (max-width: 900px) {
            .catalog-container { flex-direction: column; padding: 20px; }
            .sidebar { width: 100%; display: flex; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border); padding-bottom: 20px;}
            .sidebar h3 { width: 100%; border: none; margin-bottom: 0;}
            .category-list { display: flex; flex-wrap: wrap; gap: 10px; }
            .category-list li { background: var(--card-bg); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border); margin: 0; }
            .cart-modal { width: 100%; }
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="logo.png" alt="Apollo LTD">
        </div>
        <nav class="nav-links">
            <a href="index.html" data-i18n="nav_home">Головна</a>
            <a href="catalog.html" class="active" data-i18n="nav_catalog">Каталог</a>
            <a href="index.html#sec-04" data-i18n="nav_contacts">Контакти</a>
        </nav>
        <div class="header-controls">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="setLang('uk')" id="btn-uk">UA</button>
                <button class="lang-btn" onclick="setLang('ru')" id="btn-ru">RU</button>
                <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
            </div>
            <div class="cart-btn" onclick="toggleCart()">
                <span data-i18n="cart">Кошик</span> (<span id="cart-counter">0</span>)
            </div>
        </div>
    </header>

    <div class="catalog-container">
        <!-- БОКОВЕ МЕНЮ -->
        <aside class="sidebar">
            <h3 data-i18n="cat_title">Категорії</h3>
            <ul class="category-list" id="category-list">
                <!-- Генерується через JS -->
            </ul>
        </aside>

        <!-- СІТКА ТОВАРІВ -->
        <main class="products-grid" id="products-grid">
            <div class="loader" id="loader" data-i18n="wait">Завантаження каталогу...</div>
        </main>
    </div>

    <!-- КОРЗИНА -->
    <div class="cart-modal" id="cart-modal">
        <div class="close-cart" onclick="toggleCart()">×</div>
        <h2 style="margin-bottom: 25px; font-weight: 800;" data-i18n="cart_title">Ваше замовлення</h2>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-total-wrap"><span data-i18n="total">Разом:</span> <span id="cart-total-sum">0</span> ₴</div>
        
        <div class="checkout-form">
            <input type="text" id="client-name" data-i18n-placeholder="name_ph" placeholder="Ваше ім'я або компанія" required>
            <input type="tel" id="client-phone" data-i18n-placeholder="phone_ph" placeholder="Ваш телефон" required>
            <button onclick="sendOrder()" data-i18n="checkout_btn">Оформити замовлення</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby74IlLa9OPNPcGb3usiAUUKZNymW_EMstPbLE9h_RAIjt4uiMHJxX3QISRLrvv9No/exec'; 
        
        const siteTranslations = {
            uk: { nav_home: "Головна", nav_catalog: "Каталог", nav_contacts: "Контакти", cart: "Кошик", cat_title: "Категорії", cat_all: "Всі товари", btn_add: "В кошик", cart_title: "Ваше замовлення", total: "Разом:", name_ph: "Ваше ім'я або компанія", phone_ph: "Ваш телефон", checkout_btn: "Оформити замовлення", empty_cart: "Кошик порожній", wait: "Завантаження каталогу...", "Сорт": "Сорт" },
            ru: { nav_home: "Главная", nav_catalog: "Каталог", nav_contacts: "Контакты", cart: "Корзина", cat_title: "Категории", cat_all: "Все товары", btn_add: "В корзину", cart_title: "Ваш заказ", total: "Итого:", name_ph: "Ваше имя или компания", phone_ph: "Ваш телефон", checkout_btn: "Оформить заказ", empty_cart: "Корзина пуста", wait: "Загрузка каталога...", "Сорт": "Сорт" },
            en: { nav_home: "Home", nav_catalog: "Catalog", nav_contacts: "Contacts", cart: "Cart", cat_title: "Categories", cat_all: "All Products", btn_add: "Add to cart", cart_title: "Your Order", total: "Total:", name_ph: "Your Name/Company", phone_ph: "Your Phone", checkout_btn: "Place Order", empty_cart: "Cart is empty", wait: "Loading catalog...", "Сорт": "Grade" }
        };

        let catalogData = []; 
        let categoriesSet = new Set();
        let currentCategory = 'all';
        let cart = JSON.parse(localStorage.getItem('apollo_cart')) || [];
        let currentLang = localStorage.getItem('apollo_lang') || 'uk';

        async function fetchCatalog() {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                const tabs = await response.json();
                
                tabs.forEach(tab => {
                    const rows = tab.data;
                    if(rows.length > 2) {
                        
                        // 1. ПОПОВНЮЄМО СЛОВНИК (ідентично прайсу)
                        for(let i = 0; i < rows.length; i++) {
                            if(rows[i].length >= 3) {
                                let ukWord = rows[i][0] ? rows[i][0].trim() : '';
                                let ruWord = rows[i][1] ? rows[i][1].trim() : '';
                                let enWord = rows[i][2] ? rows[i][2].trim() : '';
                                if(ukWord && ukWord !== "УКР") {
                                    siteTranslations.uk[ukWord] = ukWord;
                                    siteTranslations.ru[ukWord] = ruWord || ukWord;
                                    siteTranslations.en[ukWord] = enWord || ukWord;
                                }
                            }
                        }

                        // 2. ДИНАМІЧНИЙ ПОШУК КОЛОНОК (в 3-му рядку)
                        let headerRow = rows[2];
                        let priceIdx = -1, unitIdx = -1, idIdx = -1, photoIdx = -1, sortIdx = 3; 
                        
                        for(let j = 0; j < headerRow.length; j++) {
                            let h = headerRow[j] ? headerRow[j].trim().toLowerCase() : '';
                            if(h.includes('ціна') || h.includes('цена') || h.includes('price')) priceIdx = j;
                            if(h.includes('од') || h.includes('вимір') || h.includes('unit')) unitIdx = j;
                            if(h === 'id' || h === 'ід') idIdx = j;
                            if(h.includes('фото') || h.includes('photo')) photoIdx = j;
                        }

                        if(priceIdx === -1) return; // Пропускаємо, якщо немає ціни

                        categoriesSet.add(tab.name);

                        // 3. ЗБИРАЄМО ТОВАРИ
                        for(let i = 3; i < rows.length; i++) {
                            let ukName = rows[i][0] ? rows[i][0].trim() : '';
                            let priceVal = rows[i][priceIdx] ? parseFloat(rows[i][priceIdx].trim().replace(/\s/g,'').replace(',','.')) : 0;
                            
                            if(ukName && !isNaN(priceVal) && priceVal > 0) {
                                let sortVal = rows[i][sortIdx] ? rows[i][sortIdx].trim() : '';
                                let idVal = idIdx !== -1 && rows[i][idIdx] ? rows[i][idIdx].trim() : `prod_${tab.name}_${i}`;
                                let unitVal = unitIdx !== -1 && rows[i][unitIdx] ? rows[i][unitIdx].trim() : 'шт';
                                let photoVal = photoIdx !== -1 && rows[i][photoIdx] ? rows[i][photoIdx].trim() : '';

                                catalogData.push({
                                    id: idVal,
                                    category: tab.name,
                                    baseName: ukName,
                                    sort: sortVal,
                                    price: priceVal,
                                    unit: unitVal,
                                    photo: photoVal
                                });
                            }
                        }
                    }
                });

                document.getElementById('loader').style.display = 'none';
                renderSidebar();
                setLang(currentLang); // Встановлює мову, рендерить товари і корзину
            } catch (error) {
                document.getElementById('loader').innerText = "Помилка завантаження.";
            }
        }

        function getTranslatedName(item, lang) {
            let name = (siteTranslations[lang] && siteTranslations[lang][item.baseName]) ? siteTranslations[lang][item.baseName] : item.baseName;
            if(item.sort && item.sort !== "-") {
                let sortWord = (siteTranslations[lang] && siteTranslations[lang]["Сорт"]) ? siteTranslations[lang]["Сорт"] : "Сорт";
                name += ` (${sortWord} ${item.sort})`;
            }
            return name;
        }

        function renderSidebar() {
            const list = document.getElementById('category-list');
            list.innerHTML = `<li onclick="setCategory('all')" id="cat-all" data-i18n="cat_all">Всі товари</li>`;
            
            categoriesSet.forEach(cat => {
                const li = document.createElement('li');
                li.setAttribute('data-cat', cat);
                li.onclick = () => setCategory(cat);
                li.id = `cat-${cat.replace(/\s+/g, '-')}`;
                list.appendChild(li);
            });
        }

        function setCategory(categoryName) {
            currentCategory = categoryName;
            document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
            const activeLi = document.getElementById(categoryName === 'all' ? 'cat-all' : `cat-${categoryName.replace(/\s+/g, '-')}`);
            if(activeLi) activeLi.classList.add('active');
            
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'all' ? catalogData : catalogData.filter(p => p.category === currentCategory);

            filtered.forEach(item => {
                const imgHtml = item.photo ? `<img src="${item.photo}" alt="">` : `<div class="no-photo">ФОТО ОЧІКУЄТЬСЯ</div>`;
                const displayName = getTranslatedName(item, currentLang);

                grid.innerHTML += `
                    <div class="card" onclick="openProduct('${item.category}', '${item.id}')">
                        <div class="card-img">${imgHtml}</div>
                        <div class="card-content">
                            <div class="card-title">${displayName}</div>
                            <div class="card-price">${item.price} ₴ / ${item.unit}</div>
                            
                            <div class="card-buy-section" onclick="event.stopPropagation()">
                                <input type="number" step="0.01" placeholder="0.0" id="qty-${item.id}">
                                <button onclick="addToCart('${item.id}')" data-i18n="btn_add">${siteTranslations[currentLang].btn_add}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openProduct(category, productId) {
            window.location.href = `product.html?category=${encodeURIComponent(category)}&id=${encodeURIComponent(productId)}`;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('apollo_lang', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('btn-' + lang);
            if(btn) btn.classList.add('active');

            // Статичні тексти
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(siteTranslations[lang] && siteTranslations[lang][key]) el.innerText = siteTranslations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(siteTranslations[lang] && siteTranslations[lang][key]) el.setAttribute('placeholder', siteTranslations[lang][key]);
            });

            // Динамічні категорії в боковому меню
            document.querySelectorAll('.sidebar li[data-cat]').forEach(el => {
                const catName = el.getAttribute('data-cat');
                el.innerText = (siteTranslations[lang] && siteTranslations[lang][catName]) ? siteTranslations[lang][catName] : catName;
            });

            renderProducts();
            updateCartUI();
        }

        // --- ЛОГІКА КОРЗИНИ ---
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('open'); }

        function addToCart(id) {
            const product = catalogData.find(p => p.id === id);
            const inputField = document.getElementById(`qty-${id}`);
            const qty = parseFloat(inputField.value.replace(',','.'));

            if(isNaN(qty) || qty <= 0) {
                inputField.style.borderColor = '#ff4444';
                setTimeout(() => inputField.style.borderColor = 'var(--border)', 1000);
                return;
            }

            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += qty;
            } else {
                // Зберігаємо базові дані для відтворення корзини в майбутньому
                cart.push({ id, baseName: product.baseName, sort: product.sort, price: product.price, unit: product.unit, qty });
            }
            
            localStorage.setItem('apollo_cart', JSON.stringify(cart));
            inputField.value = '';
            
            updateCartUI();
            const cartBtn = document.querySelector('.cart-btn');
            cartBtn.style.transform = 'scale(1.1)';
            setTimeout(() => cartBtn.style.transform = 'scale(1)', 200);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('apollo_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            let total = 0;
            if(cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">${siteTranslations[currentLang].empty_cart}</p>`;
            }

            cart.forEach(item => {
                const sum = item.price * item.qty;
                total += sum;
                const displayName = getTranslatedName(item, currentLang);
                
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="remove-item" onclick="removeFromCart('${item.id}')">×</div>
                        <div class="cart-item-title">${displayName}</div>
                        <div class="cart-item-details">
                            <span>${item.qty} ${item.unit} × ${item.price} ₴</span>
                            <span style="color:var(--accent); font-weight:700;">${sum.toFixed(0)} ₴</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total-sum').innerText = total.toFixed(0);
        }

        async function sendOrder() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if(!name || !phone) return alert(currentLang === 'uk' ? "Заповніть контакти" : "Fill the contacts");
            if(cart.length === 0) return;

            const BOT_TOKEN = '8828109529:AAHxYZQkGVLftBxBiEIIEVVXVM8_a0BsX9w'; 
            const CHAT_ID = '710362478';

            let text = `🔥 <b>НОВЕ ЗАМОВЛЕННЯ (КАТАЛОГ САЙТУ)</b>\n\n`;
            text += `👤 <b>Клієнт:</b> ${name}\n`;
            text += `📞 <b>Телефон:</b> ${phone}\n\n`;
            text += `📦 <b>Позиції:</b>\n`;
            
            let totalSum = 0;
            cart.forEach((item, i) => {
                const sum = item.price * item.qty;
                totalSum += sum;
                // В Телеграм завжди відправляємо українську назву
                const ukName = getTranslatedName(item, 'uk');
                text += `${i+1}. ${ukName} — ${item.qty} ${item.unit} (x ${item.price} ₴)\n`;
            });
            text += `\n💰 <b>РАЗОМ: ${totalSum.toFixed(0)} ₴</b>`;
            
            try {
                const btn = document.querySelector('.checkout-form button');
                btn.innerText = "Відправка...";
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
                alert(currentLang === 'uk' ? "Замовлення успішно відправлено!" : "Order sent successfully!");
                cart = [];
                localStorage.setItem('apollo_cart', JSON.stringify([]));
                updateCartUI();
                toggleCart();
                document.getElementById('client-name').value = '';
                document.getElementById('client-phone').value = '';
                btn.innerText = siteTranslations[currentLang].checkout_btn;
            } catch (error) {
                alert("Помилка відправки.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchCatalog();
            updateCartUI();
        });
    </script>
</body>
