<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Apollo LTD</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121416;
            --card-bg: #1a1d20;
            --accent: #d99058;
            --text: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(18, 20, 22, 0.95);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo h2 { letter-spacing: 2px; font-weight: 800; cursor: pointer; }
        .logo span { color: var(--accent); }
        .logo img { height: 45px; display: block; width: auto; }
        
        .nav-links a { color: var(--text); text-decoration: none; margin-right: 25px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        
        .header-controls { display: flex; gap: 30px; align-items: center; }
        
        .lang-switcher { display: flex; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .lang-btn { background: transparent; border: none; color: #888; padding: 8px 12px; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .lang-btn.active, .lang-btn:hover { background: var(--accent); color: #000; }

        .cart-btn { background: var(--accent); color: #000; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: 700; transition: 0.3s; text-transform: uppercase; font-size: 0.85rem;}
        .cart-btn:hover { box-shadow: 0 5px 15px rgba(217, 144, 88, 0.3); transform: translateY(-2px); }

        .catalog-container { display: flex; padding: 40px 50px; gap: 40px; max-width: 1600px; margin: 0 auto; align-items: flex-start; }
        
        /* ЗАКРІПЛЕНА БОКОВА ПАНЕЛЬ (STICKY) */
        .sidebar { 
            width: 260px; flex-shrink: 0; 
            position: sticky; top: 100px; 
            max-height: calc(100vh - 120px); overflow-y: auto; 
            padding-right: 15px;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .sidebar h3 { margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; font-weight: 700; text-transform: uppercase;}
        
        /* АКОРДЕОН КАТЕГОРІЙ */
        .category-list { list-style: none; }
        .category-list > li { margin-bottom: 12px; cursor: pointer; transition: 0.2s; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .category-list > li:hover, .category-list > li.active { color: var(--accent); }
        
        .sub-category-list { display: none; list-style: none; margin-top: 8px; margin-left: 10px; border-left: 1px solid var(--border); padding-left: 15px; }
        .sub-category-list.open { display: block; }
        .sub-category-list li { margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; cursor: pointer; transition: 0.2s; }
        .sub-category-list li:hover, .sub-category-list li.active { color: var(--text); }
        .arrow { font-size: 0.6rem; transition: transform 0.3s; }
        .open .arrow { transform: rotate(180deg); }

        /* ФІЛЬТРИ */
        .filter-section { margin-top: 35px; border-top: 1px solid var(--border); padding-top: 25px; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }
        .filter-group input, .filter-group select { 
            width: 100%; padding: 12px; background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border); color: white; border-radius: 5px; 
            outline: none; font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
        }
        .filter-group input:focus, .filter-group select:focus { border-color: var(--accent); }
        .filter-group select option { background: var(--bg-dark); color: white; }

        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; align-content: start; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.4); transform: translateY(-5px); }
        .card-img { width: 100%; height: 220px; background-color: #0a0b0c; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img img { transform: scale(1.05); }
        .no-photo { color: #444; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }

        .card-content { padding: 25px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; line-height: 1.4; flex: 1; }
        .card-price { color: var(--accent); font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
        
        .card-buy-section { display: flex; gap: 10px; margin-top: auto; }
        .card-buy-section input { width: 70px; padding: 12px; background: #0a0b0c; border: 1px solid var(--border); color: #fff; border-radius: 5px; text-align: center; font-size: 1rem; font-weight: 600; outline: none; }
        .card-buy-section input:focus { border-color: var(--accent); }
        .card-buy-section button { flex: 1; background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; border-radius: 5px; font-weight: 700; transition: 0.3s; font-size: 0.9rem; text-transform: uppercase; }
        .card-buy-section button:hover { background: var(--accent); color: #000; }

        .loader { width: 100%; text-align: center; padding: 100px; font-size: 1.2rem; color: #777; font-weight: 600; grid-column: 1 / -1; text-transform: uppercase; letter-spacing: 2px;}

        /* КОРЗИНА */
        .cart-modal {
            position: fixed; top: 0; right: -100%; width: 450px; height: 100vh;
            background: rgba(18, 20, 22, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); z-index: 200; padding: 40px; 
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .cart-modal.open { right: 0; }
        .close-cart { cursor: pointer; color: var(--text-muted); font-size: 2rem; text-align: right; margin-bottom: 20px; transition: 0.3s; }
        .close-cart:hover { color: var(--accent); transform: scale(1.1); }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 10px; }
        .cart-item { border-bottom: 1px solid var(--border); padding: 20px 0; position: relative; }
        .cart-item-title { font-weight: 700; margin-bottom: 10px; font-size: 1.05rem; padding-right: 25px;}
        .cart-item-details { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.95rem; }
        .remove-item { position: absolute; top: 20px; right: 0; color: #ff4444; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .cart-total-wrap { font-size: 1.5rem; font-weight: 800; text-align: right; margin-bottom: 30px; color: var(--accent); }
        
        .checkout-form input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: white; border-radius: 5px; font-family: 'Montserrat'; font-size: 1rem; outline: none;}
        .checkout-form input:focus { border-color: var(--accent); }
        .checkout-form button { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 5px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .checkout-form button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(217, 144, 88, 0.2); }

        .mobile-filter-btn { display: none; }

        @media (max-width: 900px) {
            .catalog-container { flex-direction: column; padding: 20px; }
            .mobile-filter-btn { 
                display: block; width: 100%; background: var(--card-bg); padding: 15px; 
                text-align: center; border: 1px solid var(--border); border-radius: 5px; 
                margin-bottom: 20px; cursor: pointer; font-weight: bold; color: var(--accent); text-transform: uppercase;
            }
            .sidebar { width: 100%; position: static; height: auto; max-height: none; overflow-y: visible; display: none; padding-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px;}
            .sidebar.active { display: block; }
            .cart-modal { width: 100%; }
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="logo.png" alt="Apollo LTD">
        </div>
        <nav class="nav-links">
            <a href="index.html" data-i18n="nav_home">Головна</a>
            <a href="catalog.html" class="active" data-i18n="nav_catalog">Каталог</a>
            <a href="index.html#sec-04" data-i18n="nav_contacts">Контакти</a>
        </nav>
        <div class="header-controls">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="setLang('uk')" id="btn-uk">UA</button>
                <button class="lang-btn" onclick="setLang('ru')" id="btn-ru">RU</button>
                <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
            </div>
            <div class="cart-btn" onclick="toggleCart()">
                <span data-i18n="cart">Кошик</span> (<span id="cart-counter">0</span>)
            </div>
        </div>
    </header>

    <div class="catalog-container">
        
        <div class="mobile-filter-btn" onclick="document.getElementById('sidebar').classList.toggle('active')" data-i18n="filters_btn">
            Фільтри та Категорії ▼
        </div>

        <!-- БОКОВЕ МЕНЮ ТА ФІЛЬТРИ -->
        <aside class="sidebar" id="sidebar">
            <h3 data-i18n="cat_title">Категорії</h3>
            <ul class="category-list" id="category-list">
                <!-- Генерується через JS -->
            </ul>

            <div class="filter-section">
                <h3 data-i18n="filters_title">Фільтри</h3>
                <div class="filter-group">
                    <label data-i18n="price_max">Ціна до (₴)</label>
                    <input type="number" id="price-filter" placeholder="Наприклад, 500" oninput="applyFilters()">
                </div>
                <div class="filter-group">
                    <label data-i18n="wood_type">Порода дерева</label>
                    <select id="wood-filter" onchange="applyFilters()">
                        <option value="all" data-i18n="all_woods">Всі породи</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- СІТКА ТОВАРІВ -->
        <main class="products-grid" id="products-grid">
            <div class="loader" id="loader" data-i18n="wait">Завантаження каталогу...</div>
        </main>
    </div>

    <!-- КОРЗИНА -->
    <div class="cart-modal" id="cart-modal">
        <div class="close-cart" onclick="toggleCart()">×</div>
        <h2 style="margin-bottom: 25px; font-weight: 800;" data-i18n="cart_title">Ваше замовлення</h2>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-total-wrap"><span data-i18n="total">Разом:</span> <span id="cart-total-sum">0</span> ₴</div>
        
        <div class="checkout-form">
            <input type="text" id="client-name" data-i18n-placeholder="name_ph" placeholder="Ваше ім'я або компанія" required>
            <input type="tel" id="client-phone" data-i18n-placeholder="phone_ph" placeholder="Ваш телефон" required>
            <button onclick="sendOrder()" data-i18n="checkout_btn">Оформити замовлення</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby74IlLa9OPNPcGb3usiAUUKZNymW_EMstPbLE9h_RAIjt4uiMHJxX3QISRLrvv9No/exec'; 
        
        // Глобальні змінні стану
        let catalogData = []; 
        let categoryTree = {}; // Об'єкт для збереження підкатегорій: { 'Погонаж': Set('Вагонка', 'Рейка') }
        let allWoodsSet = new Set(); // Всі знайдені породи
        
        // Стан фільтрів
        let currentCategory = 'all';
        let currentSubcategory = 'all';
        let maxPrice = Infinity;
        let currentWood = 'all';

        let cart = JSON.parse(localStorage.getItem('apollo_cart')) || [];
        let currentLang = localStorage.getItem('apollo_lang') || 'uk';

        // Словник перекладів
        const siteTranslations = {
            uk: { 
                nav_home: "Головна", nav_catalog: "Каталог", nav_contacts: "Контакти", cart: "Кошик", cat_title: "Категорії", cat_all: "Всі товари", btn_add: "В кошик", cart_title: "Ваше замовлення", total: "Разом:", name_ph: "Ваше ім'я або компанія", phone_ph: "Ваш телефон", checkout_btn: "Оформити замовлення", empty_cart: "Кошик порожній", wait: "Завантаження каталогу...", "Сорт": "Сорт",
                "м³": "м³", "м.п.": "м.п.", "шт": "шт", "м²": "м²", "Брус": "Брус",
                filters_btn: "Фільтри та Категорії ▼", filters_title: "Фільтри", price_max: "Ціна до (₴)", wood_type: "Порода дерева", all_woods: "Всі породи"
            },
            ru: { 
                nav_home: "Главная", nav_catalog: "Каталог", nav_contacts: "Контакты", cart: "Корзина", cat_title: "Категории", cat_all: "Все товары", btn_add: "В корзину", cart_title: "Ваш заказ", total: "Итого:", name_ph: "Ваше имя или компания", phone_ph: "Ваш телефон", checkout_btn: "Оформить заказ", empty_cart: "Корзина пуста", wait: "Загрузка каталога...", "Сорт": "Сорт",
                "м³": "м³", "м.п.": "м.п.", "шт": "шт", "м²": "м²", "Брус": "Брус",
                filters_btn: "Фильтры и Категории ▼", filters_title: "Фильтры", price_max: "Цена до (₴)", wood_type: "Порода дерева", all_woods: "Все породы"
            },
            en: { 
                nav_home: "Home", nav_catalog: "Catalog", nav_contacts: "Contacts", cart: "Cart", cat_title: "Categories", cat_all: "All Products", btn_add: "Add to cart", cart_title: "Your Order", total: "Total:", name_ph: "Your Name/Company", phone_ph: "Your Phone", checkout_btn: "Place Order", empty_cart: "Cart is empty", wait: "Loading catalog...", "Сорт": "Grade",
                "м³": "m³", "м.п.": "l.m.", "шт": "pcs", "м²": "m²", "Брус": "Timber",
                filters_btn: "Filters & Categories ▼", filters_title: "Filters", price_max: "Max Price (₴)", wood_type: "Wood Type", all_woods: "All Wood Types"
            }
        };

        function getTranslatedUnit(unit, lang) {
            if (!unit) return 'шт';
            return (siteTranslations[lang] && siteTranslations[lang][unit]) ? siteTranslations[lang][unit] : unit;
        }

        function getTranslatedWord(word, lang) {
            return (siteTranslations[lang] && siteTranslations[lang][word]) ? siteTranslations[lang][word] : word;
        }

        function getTranslatedName(item, lang) {
            let name = getTranslatedWord(item.baseName, lang);
            if(item.isTimber) return `${name} ${item.thickness}х${item.width}`;

            if(item.sort && item.sort !== "-" && item.sort !== "") {
                if(item.sortLabel && item.sortLabel !== "" && item.sortLabel !== "-") {
                    let label = getTranslatedWord(item.sortLabel, lang);
                    return `${name} (${label} ${item.sort})`;
                } else {
                    return `${name} (${item.sort})`;
                }
            }
            return name;
        }

        async function fetchCatalog() {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                const tabs = await response.json();
                
                catalogData = [];
                categoryTree = {};
                allWoodsSet.clear();

                tabs.forEach(tab => {
                    const rows = tab.data;
                    if(!rows || rows.length === 0) return;

                    let catName = tab.name;
                    if(!categoryTree[catName]) categoryTree[catName] = new Set();
                    let isTimberTab = catName.toLowerCase().includes('брус');

                    let headerRow = rows[2];
                    let d3Label = (headerRow && headerRow[3]) ? headerRow[3].trim() : '';

                    // Шукаємо індекси колонок "Підкатегорія" і "Порода" у шапці (рядок 3)
                    let subcatIdx = -1, woodIdx = -1;
                    if (headerRow) {
                        for(let j = 3; j < headerRow.length; j++) {
                            let h = headerRow[j] ? headerRow[j].trim().toLowerCase() : '';
                            if(h === 'підкатегорія' || h === 'подкатегория') subcatIdx = j;
                            if(h === 'порода' || h === 'порода дерева') woodIdx = j;
                        }
                    }

                    for(let i = 0; i < rows.length; i++) {
                        let r = rows[i];
                        if(!r || r.length < 4) continue;

                        let col0 = r[0] ? r[0].trim() : '';
                        if(!col0 || col0 === 'УКР' || col0.includes('Назва') || col0.includes('Порода') || col0.includes('Товщина')) continue;

                        let ruWord = r[1] ? r[1].trim() : '';
                        let enWord = r[2] ? r[2].trim() : '';
                        siteTranslations.uk[col0] = col0;
                        siteTranslations.ru[col0] = ruWord || col0;
                        siteTranslations.en[col0] = enWord || col0;

                        // Зчитуємо підкатегорію і породу, якщо знайшли такі колонки
                        let subcatVal = (subcatIdx !== -1 && r[subcatIdx]) ? r[subcatIdx].trim() : '';
                        let woodVal = (woodIdx !== -1 && r[woodIdx]) ? r[woodIdx].trim() : '';

                        if(subcatVal) categoryTree[catName].add(subcatVal);
                        if(woodVal) allWoodsSet.add(woodVal);

                        if (isTimberTab) {
                            let thickness = r[3] ? r[3].trim() : '';
                            let width = r[4] ? r[4].trim() : '';
                            let priceVal = parseFloat(r[5] ? r[5].trim().replace(/\s/g,'').replace(',','.') : 0);
                            let unitVal = r[6] ? r[6].trim() : 'м.п.';
                            let photoVal = r[7] ? r[7].trim() : '';

                            if(!thickness || !width || isNaN(priceVal) || priceVal <= 0) continue;

                            catalogData.push({
                                id: `timber_${catName}_${i}`, category: catName, subcategory: subcatVal, wood: woodVal,
                                isTimber: true, baseName: col0, thickness: thickness, width: width,
                                price: priceVal, unit: unitVal, photo: photoVal
                            });
                        } else {
                            let sortVal = r[3] ? r[3].trim() : '';
                            let priceVal = parseFloat(r[4] ? r[4].trim().replace(/\s/g,'').replace(',','.') : 0);
                            let unitVal = r[5] ? r[5].trim() : (catName.toLowerCase().includes('погонаж') ? 'м.п.' : 'м³');
                            let photoVal = r[6] ? r[6].trim() : '';
                            
                            if(isNaN(priceVal) || priceVal <= 0) continue;

                            catalogData.push({
                                id: `prod_${catName}_${i}`, category: catName, subcategory: subcatVal, wood: woodVal,
                                isTimber: false, baseName: col0, sort: sortVal, sortLabel: d3Label,
                                price: priceVal, unit: unitVal, photo: photoVal
                            });
                        }
                    }
                });

                document.getElementById('loader').style.display = 'none';
                renderSidebar();
                renderWoodFilter();
                setLang(currentLang);
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerText = "Помилка завантаження каталогу.";
            }
        }

        function renderSidebar() {
            const list = document.getElementById('category-list');
            let html = `<li onclick="setCategory('all', 'all', event)" id="cat-all" class="active" data-i18n="cat_all">${getTranslatedWord('cat_all', currentLang)}</li>`;
            
            Object.keys(categoryTree).forEach(cat => {
                let transCat = getTranslatedWord(cat, currentLang);
                let hasSub = categoryTree[cat].size > 0;
                
                html += `<li onclick="toggleCategory('${cat}', event)" id="cat-main-${formatId(cat)}">
                            ${transCat} ${hasSub ? '<span class="arrow">▼</span>' : ''}
                         </li>`;
                
                if(hasSub) {
                    html += `<ul class="sub-category-list" id="sub-${formatId(cat)}">`;
                    categoryTree[cat].forEach(sub => {
                        let transSub = getTranslatedWord(sub, currentLang);
                        html += `<li onclick="setCategory('${cat}', '${sub}', event)" id="cat-sub-${formatId(sub)}">${transSub}</li>`;
                    });
                    html += `</ul>`;
                }
            });
            list.innerHTML = html;
        }

        function renderWoodFilter() {
            const select = document.getElementById('wood-filter');
            let html = `<option value="all" data-i18n="all_woods">${getTranslatedWord('all_woods', currentLang)}</option>`;
            allWoodsSet.forEach(w => {
                html += `<option value="${w}">${getTranslatedWord(w, currentLang)}</option>`;
            });
            select.innerHTML = html;
        }

        function formatId(str) {
            return str.toLowerCase().replace(/\s+/g, '-').replace(/[^a-zа-я0-9-]/gi, '');
        }

        // Відкриває/закриває головну категорію і вибирає її
        function toggleCategory(cat, event) {
            if(event) event.stopPropagation();
            let subList = document.getElementById(`sub-${formatId(cat)}`);
            if(subList) subList.classList.toggle('open');
            setCategory(cat, 'all', null);
        }

        // Застосовує вибір категорії чи підкатегорії
        function setCategory(cat, subcat, event) {
            if(event) event.stopPropagation();
            currentCategory = cat;
            currentSubcategory = subcat;

            // Оновлюємо активні класи
            document.querySelectorAll('.category-list li, .sub-category-list li').forEach(el => el.classList.remove('active'));
            
            if(cat === 'all') {
                document.getElementById('cat-all').classList.add('active');
            } else if (subcat === 'all') {
                document.getElementById(`cat-main-${formatId(cat)}`).classList.add('active');
            } else {
                document.getElementById(`cat-main-${formatId(cat)}`).classList.add('active');
                document.getElementById(`cat-sub-${formatId(subcat)}`).classList.add('active');
            }
            
            applyFilters();
        }

        function applyFilters() {
            // Зчитуємо ціну
            let inputPrice = document.getElementById('price-filter').value;
            maxPrice = (inputPrice && !isNaN(inputPrice) && inputPrice > 0) ? parseFloat(inputPrice) : Infinity;
            
            // Зчитуємо породу
            currentWood = document.getElementById('wood-filter').value;
            
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = catalogData.filter(p => {
                let catMatch = (currentCategory === 'all') || (p.category === currentCategory);
                let subMatch = (currentSubcategory === 'all') || (p.subcategory === currentSubcategory);
                let priceMatch = (p.price <= maxPrice);
                let woodMatch = (currentWood === 'all') || (p.wood === currentWood);
                return catMatch && subMatch && priceMatch && woodMatch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 50px;">За вашими фільтрами нічого не знайдено.</div>`;
                return;
            }

            filtered.forEach(item => {
                const imgHtml = item.photo ? `<img src="${item.photo}" alt="">` : `<div class="no-photo">ФОТО ОЧІКУЄТЬСЯ</div>`;
                const displayName = getTranslatedName(item, currentLang);
                const displayUnit = getTranslatedUnit(item.unit, currentLang);

                grid.innerHTML += `
                    <div class="card" onclick="openProduct('${item.category}', '${item.id}')">
                        <div class="card-img">${imgHtml}</div>
                        <div class="card-content">
                            <div class="card-title">${displayName}</div>
                            <div class="card-price">${item.price} ₴ / ${displayUnit}</div>
                            
                            <div class="card-buy-section" onclick="event.stopPropagation()">
                                <input type="number" step="0.01" placeholder="0.0" id="qty-${item.id}">
                                <button onclick="addToCart('${item.id}')" data-i18n="btn_add">${siteTranslations[currentLang].btn_add}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openProduct(category, productId) {
            window.location.href = `product.html?category=${encodeURIComponent(category)}&id=${encodeURIComponent(productId)}`;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('apollo_lang', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('btn-' + lang);
            if(btn) btn.classList.add('active');

            // Переклад статичних текстів
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(siteTranslations[lang] && siteTranslations[lang][key]) el.innerText = siteTranslations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(siteTranslations[lang] && siteTranslations[lang][key]) el.setAttribute('placeholder', siteTranslations[lang][key]);
            });

            // Оновлюємо UI бокової панелі
            renderSidebar();
            renderWoodFilter();
            
            // Відновлюємо активні класи після перерендеру меню
            if(currentCategory !== 'all') {
                let subList = document.getElementById(`sub-${formatId(currentCategory)}`);
                if(subList) subList.classList.add('open');
            }
            setCategory(currentCategory, currentSubcategory, null);
            document.getElementById('wood-filter').value = currentWood;

            renderProducts();
            updateCartUI();
        }

        function toggleCart() { 
            document.getElementById('cart-modal').classList.toggle('open'); 
        }

        function addToCart(id) {
            const product = catalogData.find(p => p.id === id);
            const inputField = document.getElementById(`qty-${id}`);
            const qty = parseFloat(inputField.value.replace(',', '.'));

            if(isNaN(qty) || qty <= 0) {
                inputField.style.borderColor = '#ff4444';
                setTimeout(() => inputField.style.borderColor = 'var(--border)', 1000);
                return;
            }

            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += qty;
            } else {
                cart.push({ 
                    id: product.id, isTimber: product.isTimber, thickness: product.thickness, width: product.width,
                    baseName: product.baseName, sort: product.sort, sortLabel: product.sortLabel, price: product.price, unit: product.unit, qty 
                });
            }
            
            localStorage.setItem('apollo_cart', JSON.stringify(cart));
            inputField.value = '';
            
            updateCartUI();
            const cartBtn = document.querySelector('.cart-btn');
            cartBtn.style.transform = 'scale(1.1)';
            setTimeout(() => cartBtn.style.transform = 'scale(1)', 200);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('apollo_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            let total = 0;
            if(cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">${siteTranslations[currentLang].empty_cart}</p>`;
            }

            cart.forEach(item => {
                const sum = item.price * item.qty;
                total += sum;
                const displayName = getTranslatedName(item, currentLang);
                const displayUnit = getTranslatedUnit(item.unit, currentLang);
                
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="remove-item" onclick="removeFromCart('${item.id}')">×</div>
                        <div class="cart-item-title">${displayName}</div>
                        <div class="cart-item-details">
                            <span>${item.qty} ${displayUnit} × ${item.price} ₴</span>
                            <span style="color:var(--accent); font-weight:700;">${sum.toFixed(0)} ₴</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total-sum').innerText = total.toFixed(0);
        }

        async function sendOrder() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if(!name || !phone) return alert(currentLang === 'uk' ? "Заповніть контакти" : "Fill the contacts");
            if(cart.length === 0) return;

            const BOT_TOKEN = '8828109529:AAHxYZQkGVLftBxBiEIIEVVXVM8_a0BsX9w'; 
            const CHAT_ID = '710362478';

            let text = `🔥 <b>НОВЕ ЗАМОВЛЕННЯ (КАТАЛОГ САЙТУ)</b>\n\n`;
            text += `👤 <b>Клієнт:</b> ${name}\n`;
            text += `📞 <b>Телефон:</b> ${phone}\n\n`;
            text += `📦 <b>Позиції:</b>\n`;
            
            let totalSum = 0;
            cart.forEach((item, i) => {
                const sum = item.price * item.qty;
                totalSum += sum;
                const ukName = getTranslatedName(item, 'uk');
                text += `${i+1}. ${ukName} — ${item.qty} ${item.unit} (x ${item.price} ₴)\n`;
            });
            text += `\n💰 <b>РАЗОМ: ${totalSum.toFixed(0)} ₴</b>`;
            
            try {
                const btn = document.querySelector('.checkout-form button');
                btn.innerText = "Відправка...";
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
                alert(currentLang === 'uk' ? "Замовлення успішно відправлено!" : "Order sent successfully!");
                cart = [];
                localStorage.setItem('apollo_cart', JSON.stringify([]));
                updateCartUI();
                toggleCart();
                document.getElementById('client-name').value = '';
                document.getElementById('client-phone').value = '';
                btn.innerText = siteTranslations[currentLang].checkout_btn;
            } catch (error) {
                alert("Помилка відправки.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchCatalog();
            updateCartUI();
        });
    </script>
</body>
</html>
